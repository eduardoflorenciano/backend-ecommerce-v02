spring.application.name=demo

# Configuracao do PostgreSQL (credenciais vindas de variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bdAutoCenterSilva}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Configuracao do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Numero do WhatsApp da borracharia
whatsapp.numero-borracharia=${WHATSAPP_NUMERO:5545999977015}

# Logger
logging.level.root=INFO
logging.level.com.autocentersilva=DEBUG
logging.level.org.springframework=WARN
logging.file.name=logs/estoque-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
