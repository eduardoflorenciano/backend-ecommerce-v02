spring.application.name=demo

# Configuracao do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bdAutoCenterSilva
spring.datasource.username=postgres
spring.datasource.password=2020
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracao do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Config do numero do wats
whatsapp.numero-borracharia=5545999977015

# Config do logger
logging.level.root=INFO
logging.level.com.seuprojeto.estoque=DEBUG
logging.level.org.springframework=WARN

# Arquivo pare ver os loggers
logging.file.name=logs/estoque-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Mostra a mensagem de erro na resposta HTTP
spring.web.error.include-message=always